name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1 — pure-Python tests (no C++ build needed).
  # F30 fix: test across Python 3.10, 3.11, and 3.12 matrix on both OS platforms.
  python-tests:
    name: python tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_quant/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run Tier 1 tests
        run: python -m pytest python_quant/tests -v

  # Tier 2 — C++ engine + pybind module + parity/diff tests on real bytes.
  build-cpp:
    name: C++ build + ctest + pybind parity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_quant/requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install cmake
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DNEXUS_BUILD_PYBIND=ON \
            -DNEXUS_NATIVE_ARCH=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(command -v python)"
      - name: Build
        run: cmake --build build --config Release -j
      - name: CTest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
      - name: Parity + diff tests (needs compiled module in bindings/)
        run: python -m pytest python_quant/tests bindings/tests -v

  # Lint — F30 fix: lint all Python codebase with pinned ruff version
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (pinned via requirements-dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: ruff check (all Python modules)
        run: ruff check python_quant/ bindings/ --exclude="*.ipynb"